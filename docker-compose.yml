services:
  forecast-automator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forecast-automator-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./outbox:/app/outbox
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
