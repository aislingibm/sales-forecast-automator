name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify synthetic data generation determinism
        run: |
          python scripts/generate_synthetic_data.py --seed 42 --outdir data/snapshots

      - name: Run Pytest Suite with Coverage Enforcement (>80%)
        run: |
          PYTHONPATH=. pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Validate Legacy Reference Pivot Parity
        run: |
          python scripts/reference_pivot.py "data/snapshots/snapshot_$(date +%F).csv"
